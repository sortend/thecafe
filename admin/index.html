<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | The Yaari Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#F4FAF7;--ink:#12302B;--muted:#5E7872;--brand:#0E6B5C;--brand-d:#094A40;--sun:#F4B23E;--rose:#FF8FA3;--line:#DDEAE4;--ok:#1A8F5A;--bad:#D6453D}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;font-weight:600;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
.btn-ghost{background:#fff;border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--brand)}
.btn-bad{background:#ffe3e0;color:#a52e27}.btn-sun{background:var(--sun)}.btn-sm{padding:6px 14px;font-size:.85rem}.btn[disabled]{opacity:.5}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 80% 0,#d3f0e4,transparent),radial-gradient(500px 400px at 0 100%,#fff0cf,transparent),var(--bg)}
.login form{width:min(420px,100%);background:#fff;padding:36px;border-radius:30px;box-shadow:0 30px 60px -30px rgba(14,107,92,.5)}
.login h1{font-size:2rem;margin-bottom:6px}.login p{color:var(--muted);margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:.85rem;font-weight:600}
.field input,.field select,.field textarea{padding:11px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,107,92,.12)}
.field small{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.err{color:var(--bad);font-size:.9rem;margin-bottom:10px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{font:800 1.25rem 'Bricolage Grotesque';padding:6px 12px 18px;display:flex;gap:10px;align-items:center}
aside .brand i{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
aside button.tab{text-align:left;padding:11px 14px;border-radius:14px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
aside button.tab:hover{background:#eef6f2;color:var(--ink)}aside button.tab.on{background:var(--ink);color:#fff}
aside .dot{background:var(--rose);color:#fff;border-radius:10px;font-size:.72rem;padding:1px 8px}
aside .foot{margin-top:auto;font-size:.82rem;color:var(--muted);padding:10px 12px}
main{padding:34px;max-width:1100px;width:100%}
main h1{font-size:2.2rem;margin-bottom:6px}.sub{color:var(--muted);margin-bottom:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.stat b{display:block;font:800 2rem 'Bricolage Grotesque'}.stat span{color:var(--muted);font-size:.88rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:20px}
.panel h3{margin-bottom:14px;font-size:1.2rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{padding:7px 15px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:.9rem}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:18px}
.item .th{width:64px;height:64px;border-radius:12px;background:#e7f3ed;overflow:hidden;display:grid;place-items:center;font:800 1.6rem 'Bricolage Grotesque';color:#8fb9ad}.item .th img{width:100%;height:100%;object-fit:cover}
.item p{color:var(--muted);font-size:.85rem}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.72rem;padding:2px 9px;border-radius:99px;font-weight:700}.tag.ok{background:#d9f3e5;color:#13703f}.tag.bad{background:#ffdcd9;color:#a52e27}.tag.mid{background:#fff0c7;color:#8a5a00}
.order{border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;background:#fff}.order.new{border-color:var(--sun);box-shadow:0 0 0 4px #fff3d1}
.order header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.order .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:.92rem}.order small{color:var(--muted)}
.order select{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line)}
.grid-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{position:relative;border-radius:18px;overflow:hidden;background:#e7f3ed;aspect-ratio:1}.gcard img{width:100%;height:100%;object-fit:cover}
.gcard .x{position:absolute;top:8px;right:8px}.gcard p{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;color:#fff;font-size:.85rem;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.empty{padding:34px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:22px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-radius:18px;background:#eef6f2;margin-bottom:18px}
.switch{appearance:none;width:52px;height:30px;border-radius:15px;background:#c7d6d0;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}.switch:checked{background:var(--ok)}.switch:checked::after{left:25px}
#amap{height:320px;border-radius:18px;border:1px solid var(--line);margin:10px 0;z-index:1}
.pin span{display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--rose);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(10,30,26,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal .box{background:#fff;border-radius:28px;padding:28px;width:min(620px,100%);max-height:94vh;overflow:auto}
.imgpick{display:flex;gap:14px;align-items:center}.imgpick .th{width:90px;height:90px;border-radius:16px;background:#e7f3ed;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center}.imgpick img{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}.toast{background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;animation:tin .3s}.toast.bad{background:var(--bad)}@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.menu-btn{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}aside .brand,aside .foot{display:none}aside button.tab{white-space:nowrap}main{padding:20px 14px}.order .grid,.row2,.row3{grid-template-columns:1fr}.item{grid-template-columns:56px 1fr}.item .acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div id="root"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
